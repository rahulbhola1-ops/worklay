# Production: the Worklay app plus its PostgreSQL database.
# Settings come from a .env file next to this file (see .env.example).
services:
  db:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worklay}
      POSTGRES_USER: ${POSTGRES_USER:-worklay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - worklay-pg:/var/lib/postgresql # Postgres 18+ keeps its data below this folder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worklay:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3019:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-worklay}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-worklay}
      # Sign in with Google (optional)
      PUBLIC_URL: ${PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Card payments through Stripe Connect (optional)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Profile photos in Cloudflare R2 (optional)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-worklay}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    restart: unless-stopped

volumes:
  worklay-pg:
